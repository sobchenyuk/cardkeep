<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f6f5ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100e1f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CardKeep" />
    <link rel="icon" type="image/svg+xml" href="/cardkeep/icon.svg" />
    <link rel="apple-touch-icon" href="/cardkeep/apple-touch-icon.png" />
    <title>CardKeep</title>
    <!-- Splash: inline so it paints instantly, before any JS bundle loads. -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 1000; background: #6a4cff; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; transition: opacity .45s ease, transform .45s ease; }
      #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .deck { position: relative; width: 200px; height: 150px; margin-bottom: 34px; }
      #splash .c { position: absolute; left: 0; top: 20px; width: 200px; height: 126px; border-radius: 22px; }
      #splash .b { background: #f5a524; animation: sp-fanb .7s .1s cubic-bezier(.2,.8,.2,1) both; }
      #splash .f { background: #fff; padding: 22px; box-shadow: 0 16px 40px rgba(20,10,80,.35); animation: sp-fanf .7s cubic-bezier(.2,.8,.2,1) both; }
      #splash .f i { display: block; width: 84px; height: 12px; border-radius: 6px; background: #6a4cff; }
      #splash .bars { position: absolute; left: 22px; bottom: 20px; display: flex; gap: 4px; height: 34px; }
      #splash .bars b { background: #14122b; transform-origin: bottom; animation: sp-bar .35s cubic-bezier(.2,.8,.2,1) both; }
      #splash .name { font-size: 34px; font-weight: 800; letter-spacing: -.02em; animation: sp-up .6s .55s cubic-bezier(.2,.8,.2,1) both; }
      #splash .tag { font-size: 15px; margin-top: 6px; color: rgba(255,255,255,.8); animation: sp-up .6s .7s cubic-bezier(.2,.8,.2,1) both; }
      #splash .load { position: absolute; bottom: calc(64px + env(safe-area-inset-bottom)); width: 120px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); overflow: hidden; }
      #splash .load::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 2px; background: #fff; animation: sp-slide 1.1s ease-in-out infinite; }
      @keyframes sp-fanb { from { transform: translateY(60px); opacity: 0 } to { transform: translate(14px,-18px) rotate(-9deg); opacity: 1 } }
      @keyframes sp-fanf { from { transform: translateY(80px) scale(.9); opacity: 0 } to { transform: none; opacity: 1 } }
      @keyframes sp-bar { from { transform: scaleY(0) } to { transform: scaleY(1) } }
      @keyframes sp-up { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
      @keyframes sp-slide { from { transform: translateX(-100%) } to { transform: translateX(250%) } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation-duration: .01s !important; animation-delay: 0s !important; } }
    </style>
    <script>
      // Apply saved theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem('cardkeep.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="deck">
        <div class="c b"></div>
        <div class="c f"><i></i><div class="bars"><b style="width:3px;animation-delay:.35s"></b><b style="width:2px;animation-delay:.38s"></b><b style="width:5px;animation-delay:.41s"></b><b style="width:2px;animation-delay:.44s"></b><b style="width:3px;animation-delay:.47s"></b><b style="width:6px;animation-delay:.5s"></b><b style="width:2px;animation-delay:.53s"></b><b style="width:4px;animation-delay:.56s"></b><b style="width:2px;animation-delay:.59s"></b><b style="width:3px;animation-delay:.62s"></b><b style="width:5px;animation-delay:.65s"></b><b style="width:2px;animation-delay:.68s"></b><b style="width:3px;animation-delay:.71s"></b></div></div>
      </div>
      <div class="name">CardKeep</div>
      <div class="tag">Ваші картки. Ваші дані.</div>
      <div class="load"></div>
    </div>
    <script>
      // Safety net: never keep the splash longer than 6 s even if the app fails to start.
      window.__splashStart = performance.now()
      setTimeout(function () { var s = document.getElementById('splash'); if (s) s.remove() }, 6000)
    </script>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
